[workspace]
members = ["crates/xml-arrow", "crates/xml-io"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arrow-array = "58"
arrow-schema = "58"
roxmltree = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std", "io", "async-await"] }
quick-xml = { version = "0.41", default-features = false, features = ["async-tokio"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
thiserror = "2"
opendal = { version = "0.59.3", default-features = false, features = ["services-fs"] }
futures-executor = "0.3"
url = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
xml-arrow = { path = "crates/xml-arrow", version = "0.1.0" }
