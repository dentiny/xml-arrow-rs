version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Upgrade these related dependency families manually.
    ignore:
      - dependency-name: "arrow"
      - dependency-name: "arrow-*"
      - dependency-name: "parquet"
      - dependency-name: "parquet-*"
      - dependency-name: "lance"
      - dependency-name: "lance-*"
      - dependency-name: "datafusion"
      - dependency-name: "datafusion-*"
